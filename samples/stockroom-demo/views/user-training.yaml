# User training — the slide-deck replacement.
# Structured slide layouts (Slides v2): region content is markdown that may hold inline
# ::: embed dw:chapter#anchor ::: live-linked blocks. All embeds link user-tagged
# chapters only. Legacy single-content slides are kept to prove they still normalize.
id: user-training
title: User Training
audience: user
mode: slides
slides:
  # ── 1. section-header ──────────────────────────────────────────────────────────
  # No regions expected for section-header (SlideLayout.RegionsFor returns []).
  - layout: section-header
    title: Stockroom — User Training
    subtitle: Learn to receive goods, read the screens, and keep stock accurate

  # ── 2. title-content ───────────────────────────────────────────────────────────
  # body region: authored markdown (bullets) — pure custom content, no embed.
  - layout: title-content
    title: What You Will Learn
    subtitle: This session covers security, startup, and daily operation
    regions:
      body: |
        - **Security** — sign-in rules and session locks
        - **Daily startup** — step-by-step station power-on
        - **Receiving goods** — scanning items and confirming shelves
        - **What to do on a mismatch** — quarantine shelf procedure

  # ── 3. two-column ──────────────────────────────────────────────────────────────
  # left region: authored markdown; right region: inline embed (live-linked) — both paths.
  - layout: two-column
    title: Security Rules & Functions
    regions:
      left: |
        ## Before you start

        - Personal account only, never shared
        - Never leave a signed-in scanner unattended
        - Never book on someone else's account
        - Lock the screen before walking away
      right: |
        ::: embed dw:security-summary#security-functions width=80%
        :::

  # ── 4. big-media ───────────────────────────────────────────────────────────────
  # media region: inline embed (live-linked), sized to 60% — exercises the embed path
  # AND the linked-box width/reflow resize on its own.
  - layout: big-media
    title: User Screens
    regions:
      media: |
        ::: embed dw:daily-operations#user-screens width=60%
        :::

  # ── 5. title-content — embeds the receiving-group (group embed fixture) ────────
  - layout: title-content
    title: Receiving Goods
    subtitle: Scan, check, shelve — end-to-end steps
    regions:
      body: |
        ::: embed dw:system-overview#receiving-group
        :::

  # ── legacy slides carried forward ──────────────────────────────────────────────
  - include: system-overview#what-it-does
  - include: security-summary#access-rules
  - include: daily-operations#daily-startup
  - title: Running the day
    include: system-overview#receiving-workflow
  - markdown: |
      ## Questions?

      Contact your team lead or the support desk.

