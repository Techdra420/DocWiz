<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>edit scenario</title>
<!-- M2 gate scenario (dev): drives a REAL end-to-end edit through the live editor —
     GET /api/editor-doc → PM doc → typed text via a transaction → byte-surgical
     PUT — then reports. Run against a SCRATCH COPY of a project, never the real one
     (tools/fidelity/run-edit-scenario.ps1). ?file=<chapter>&text=<suffix> -->
<link rel="stylesheet" href="/app/tokens.css">
<link rel="stylesheet" href="/app/vendor/prosemirror/prosemirror-view/prosemirror.css">
<link rel="stylesheet" href="/app/site-scoped.css">
<link rel="stylesheet" href="/app/app.css">
<script type="importmap">
{
  "imports": {
    "prosemirror-model": "/app/vendor/prosemirror/prosemirror-model/index.js",
    "prosemirror-state": "/app/vendor/prosemirror/prosemirror-state/index.js",
    "prosemirror-view": "/app/vendor/prosemirror/prosemirror-view/index.js",
    "prosemirror-transform": "/app/vendor/prosemirror/prosemirror-transform/index.js",
    "prosemirror-commands": "/app/vendor/prosemirror/prosemirror-commands/index.js",
    "prosemirror-keymap": "/app/vendor/prosemirror/prosemirror-keymap/index.js",
    "prosemirror-history": "/app/vendor/prosemirror/prosemirror-history/index.js",
    "prosemirror-inputrules": "/app/vendor/prosemirror/prosemirror-inputrules/index.js",
    "prosemirror-dropcursor": "/app/vendor/prosemirror/prosemirror-dropcursor/index.js",
    "prosemirror-gapcursor": "/app/vendor/prosemirror/prosemirror-gapcursor/index.js",
    "prosemirror-schema-list": "/app/vendor/prosemirror/prosemirror-schema-list/index.js",
    "orderedmap": "/app/vendor/prosemirror/orderedmap/index.js",
    "w3c-keyname": "/app/vendor/prosemirror/w3c-keyname/index.js",
    "rope-sequence": "/app/vendor/prosemirror/rope-sequence/index.js"
  }
}
</script>
</head>
<body>
<div id="editor2" class="dw-live-surface"></div>
<script type="module">
  import './main.js';
  import { buildTableModel } from './tableview.js';
  import { NodeSelection, TextSelection } from 'prosemirror-state';

  const params = new URLSearchParams(location.search);
  const file = params.get('file');
  const mode = params.get('mode') || 'paragraph';
  const text = params.get('text') || ' (scenario edit)';
  const result = { ok: false };

  function firstNodePos(view, typeName) {
    let pos = -1;
    let scan = 0;
    view.state.doc.content.forEach((node) => {
      if (pos < 0 && node.type.name === typeName) pos = scan;
      scan += node.nodeSize;
    });
    return pos;
  }

  function selectTable(view) {
    const pos = firstNodePos(view, 'table');
    if (pos < 0) throw new Error('no table in chapter');
    view.dispatch(view.state.tr.setSelection(NodeSelection.create(view.state.doc, pos)));
    return pos;
  }

  const mouse = (el, type, opts) =>
    el.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, ...opts }));

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  try {
    const ch = await (await fetch('/api/chapter?file=' + encodeURIComponent(file))).json();
    await window.DocWizEditor2.open(file, { onDirty() {} });
    const view = window.DocWizEditor2._view();

    /* ---- ADR-008 context-tools capability-parity gate (audit F1 / rule 21): each kind's
       capability set == the shared vocabulary minus its declared, reasoned omissions. Pure
       module logic (no doc interaction); window.DocWizContextTools is set at module load. ---- */
    if (mode === 'capabilityparity') {
      const ct = window.DocWizContextTools;
      const audit = ct && ct.auditCapabilities ? ct.auditCapabilities() : { ok: false, problems: ['window.DocWizContextTools not loaded'] };
      result.checks = { kinds: Object.keys((ct && ct.LAYOUT) || {}), problemCount: audit.problems.length };
      result.ok = audit.ok;
      if (!audit.ok) result.detail = audit.problems.join(' | ');

    /* ---- UI regression modes (feedback round 1) — no save involved ---- */
    } else if (mode === 'clickcells') {
      // Repro of the disappearing-cells bug: click through cells; every previously
      // visited cell must keep its original content.
      selectTable(view);
      await sleep(50);
      const fig = document.querySelector('#editor2 .dw-table-figure.e2-active');
      if (!fig) throw new Error('table did not activate on selection');
      const cellSel = (r, c) => {
        const tr = fig.querySelectorAll('tbody tr')[r];
        return tr ? tr.children[c] : null;
      };
      const cols = fig.querySelectorAll('tbody tr')[0].children.length;
      const rows = Math.min(3, fig.querySelectorAll('tbody tr').length);
      const originals = [];
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          originals.push({ r, c, html: cellSel(r, c).innerHTML });
      // Click through EVERY cell (incl. image cells), then land on (0,0) again.
      for (const o of originals) {
        const cell = cellSel(o.r, o.c);
        if (cell) mouse(cell, 'mousedown');
        await sleep(25);
      }
      mouse(cellSel(0, 0), 'mousedown');
      await sleep(40);
      const bad = [];
      for (const o of originals) {
        if (o.r === 0 && o.c === 0) continue; // currently editing
        const now = cellSel(o.r, o.c) ? cellSel(o.r, o.c).innerHTML : '(missing)';
        if (now !== o.html) bad.push({ r: o.r, c: o.c, was: o.html.slice(0, 160), now: now.slice(0, 160) });
      }
      result.checks = {
        activated: true,
        editing: !!fig.querySelector('.e2-cell-editing'),
        cells: originals.length,
        contentsKept: bad.length === 0,
      };
      result.ok = result.checks.contentsKept && result.checks.editing;
      if (!result.ok) result.detail = JSON.stringify(bad.slice(0, 4));
    } else if (mode === 'autofmt') {
      // Markdown typing shortcuts: characters go through the REAL input path
      // (handleTextInput, the hook input rules register on).
      const type = (s) => {
        for (const ch of s) {
          const { from, to } = view.state.selection;
          const handled = view.someProp('handleTextInput', (f) => f(view, from, to, ch));
          if (!handled) view.dispatch(view.state.tr.insertText(ch, from, to));
        }
      };
      // Fresh empty paragraph at the END of the doc, cursor inside.
      const end = view.state.doc.content.size;
      view.dispatch(view.state.tr.insert(end, view.state.schema.nodes.paragraph.create()));
      view.dispatch(view.state.tr.setSelection(TextSelection.create(view.state.doc, view.state.doc.content.size - 1)));
      type('**bold**');
      const para = view.state.selection.$from.parent;
      const boldOk = para.textContent === 'bold'
        && para.firstChild && para.firstChild.marks.some((m) => m.type.name === 'strong');
      // New paragraph below, then "# " must convert it to a heading.
      const end2 = view.state.doc.content.size;
      view.dispatch(view.state.tr.insert(end2, view.state.schema.nodes.paragraph.create()));
      view.dispatch(view.state.tr.setSelection(TextSelection.create(view.state.doc, view.state.doc.content.size - 1)));
      type('# ');
      const headOk = view.state.selection.$from.parent.type.name === 'heading';
      // "2026. " must NOT become a list (conservative ordered-list trigger).
      const end3 = view.state.doc.content.size;
      view.dispatch(view.state.tr.insert(end3, view.state.schema.nodes.paragraph.create()));
      view.dispatch(view.state.tr.setSelection(TextSelection.create(view.state.doc, view.state.doc.content.size - 1)));
      type('2026. x');
      const noListOk = view.state.selection.$from.parent.type.name === 'paragraph'
        && view.state.selection.$from.parent.textContent === '2026. x';
      result.checks = { boldOk, headOk, noListOk };
      result.ok = boldOk && headOk && noListOk;
    } else if (mode === 'aligncycle') {
      // Word-style alignment regression (stakeholder feedback): center turns on,
      // center->right switches IN PLACE (never nests a second wrapper), picking the
      // alignment it already has keeps it, left removes. Drives the REAL toolbar
      // Align menu (the toolbar design pass folded the three buttons into it).
      const alignBtn = Array.from(document.querySelectorAll('.e2-maintoolbar button'))
        .find((b) => (b.getAttribute('data-tip') || '').startsWith('Alignment'));
      if (!alignBtn) throw new Error('Align menu button not found');
      const pick = (label) => ({
        click: () => {
          alignBtn.click();
          const item = Array.from(document.querySelectorAll('.e2-menu .mi'))
            .find((m) => m.textContent.trim() === label);
          if (!item) throw new Error('Align menu has no ' + label);
          item.click();
        },
      });
      const center = pick('Center');
      const right = pick('Right');
      const left = pick('Left');
      let prefix = null;
      const findP = () => {
        let r = null;
        view.state.doc.descendants((n, pos) => {
          if (r) return false;
          if (n.type.name === 'paragraph'
              && (prefix === null ? n.textContent.length > 5 : n.textContent.startsWith(prefix))) {
            r = { node: n, pos };
            return false;
          }
          return true;
        });
        return r;
      };
      let p = findP();
      if (!p) throw new Error('no paragraph to align');
      prefix = p.node.textContent.slice(0, 20);
      const put = () => {
        p = findP();
        view.dispatch(view.state.tr.setSelection(TextSelection.create(view.state.doc, p.pos + 1)));
      };
      const wrapOf = () => {
        p = findP();
        const $p = view.state.doc.resolve(p.pos);
        for (let d = $p.depth; d >= 1; d--) {
          const n = $p.node(d);
          if (n.type.name === 'container' && (n.attrs.type === 'center' || n.attrs.type === 'right'))
            return n.attrs.type;
        }
        return null;
      };
      const depthOf = () => { p = findP(); return view.state.doc.resolve(p.pos).depth; };
      const checks = {};
      put(); center.click(); await sleep(20);
      checks.centerOn = wrapOf() === 'center';
      put(); right.click(); await sleep(20);
      checks.switchNoNest = wrapOf() === 'right' && depthOf() === 1;
      put(); right.click(); await sleep(20);
      checks.sameKeeps = wrapOf() === 'right' && depthOf() === 1;
      put(); center.click(); await sleep(20);
      put(); left.click(); await sleep(20);
      checks.leftRemoves = wrapOf() === null && depthOf() === 0;
      result.checks = checks;
      result.ok = Object.values(checks).every(Boolean);
    } else if (mode === 'cellopen') {
      // EVERY cell of EVERY table must OPEN for in-place editing: the lock
      // pill is reserved for genuinely unrepresentable content and the corpus
      // contains none. Locked cells are reported with the exact compare inputs.
      const tablePos = [];
      let scan = 0;
      view.state.doc.content.forEach((node) => {
        if (node.type.name === 'table') tablePos.push(scan);
        scan += node.nodeSize;
      });
      if (!tablePos.length) throw new Error('no table in chapter');
      const locked = [];
      let opened = 0, total = 0, headerCells = 0;
      for (let t = 0; t < tablePos.length; t++) {
        view.dispatch(view.state.tr.setSelection(NodeSelection.create(view.state.doc, tablePos[t])));
        await sleep(60);
        const fig = document.querySelector('#editor2 .dw-table-figure.e2-active');
        if (!fig) throw new Error('table ' + t + ' did not activate on selection');
        // r = -1 is the HEADER row (the tableview's own addressing): the stakeholder's
        // image cells live in header rows too — sweeping only tbody missed them.
        const trOf = (r) => r < 0
          ? fig.querySelector('thead tr')
          : fig.querySelectorAll('tbody tr')[r];
        const rowCount = fig.querySelectorAll('tbody tr').length;
        for (let r = -1; r < rowCount; r++) {
          const colCount = trOf(r) ? trOf(r).children.length : 0;
          for (let c = 0; c < colCount; c++) {
            const cell = trOf(r) ? trOf(r).children[c] : null;
            if (!cell) continue;
            total++;
            if (r < 0) headerCells++;
            window.__dwLockDebug = null;
            // Aim at the picture when the cell holds one — that is what a user
            // actually clicks; the event bubbles to the cell either way.
            mouse(cell.querySelector('img, .img-placeholder') || cell, 'mousedown');
            await sleep(40);
            if (fig.querySelector('.e2-cell-editing')) opened++;
            else locked.push({ t, r, c, debug: window.__dwLockDebug });
          }
        }
        // Step out before moving to the next table (Esc-equivalent).
        const open = document.querySelector('#editor2 .e2-cell-editing');
        if (open) mouse(document.querySelector('#editor2'), 'mousedown');
        await sleep(40);
      }
      result.checks = { tables: tablePos.length, total, headerCells, opened, locked: locked.length };
      result.ok = total > 0 && headerCells > 0 && locked.length === 0;
      if (!result.ok) result.detail = JSON.stringify(locked.slice(0, 3));
    } else if (mode === 'undo') {
      // +Row via the real context-bar button, then Ctrl+Z restores the row count.
      selectTable(view);
      await sleep(50);
      const fig = document.querySelector('#editor2 .dw-table-figure.e2-active');
      const rows = () => fig.querySelectorAll('tbody tr').length
        || document.querySelector('#editor2 .dw-table-figure').querySelectorAll('tbody tr').length;
      const before = rows();
      // Phase 4: table tools moved into the main toolbar shell's context track (.e2-tb-ctx)
      // when a table is selected. The same behavioral assertion holds — clicking the
      // + Row button adds a row; the selector changed to match the new DOM location.
      const addRow = Array.from(document.querySelectorAll('.e2-maintoolbar button'))
        .find((b) => (b.getAttribute('data-tip') || '').includes('Insert a row'));
      if (!addRow) throw new Error('context bar +Row button not found');
      addRow.click();
      await sleep(50);
      const afterAdd = document.querySelector('#editor2 .dw-table-figure').querySelectorAll('tbody tr').length;
      view.focus();
      view.dom.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true, cancelable: true }));
      await sleep(50);
      const afterUndo = document.querySelector('#editor2 .dw-table-figure').querySelectorAll('tbody tr').length;
      result.checks = { before, afterAdd, afterUndo };
      result.ok = afterAdd === before + 1 && afterUndo === before;
    } else if (mode === 'dragwidth2') {
      // Two consecutive width drags must BOTH take effect.
      selectTable(view);
      await sleep(50);
      const widthsOf = () => {
        const pos = firstNodePos(view, 'table');
        const node = view.state.doc.nodeAt(pos);
        return node.attrs.meta.model ? node.attrs.meta.model.widths : node.attrs.meta.widths;
      };
      const drag = async (dx) => {
        const grip = document.querySelector('#editor2 .dw-table-figure.e2-active thead th .e2-colgrip');
        if (!grip) throw new Error('column grip not found');
        const th = grip.closest('th');
        const wStart = th.getBoundingClientRect().width;
        const x0 = grip.getBoundingClientRect().left;
        mouse(grip, 'mousedown', { clientX: x0 });
        await sleep(20);
        mouse(document, 'mousemove', { clientX: x0 + dx });
        await sleep(40);
        const wMid = th.getBoundingClientRect().width; // column width DURING the drag (before release)
        const tbl = th.closest('table');
        const colEl = tbl.querySelector('colgroup col');
        const diag = { tl: getComputedStyle(tbl).tableLayout, col0w: colEl ? colEl.style.width : '(no col)', th0styleW: th.style.width };
        mouse(document, 'mouseup', { clientX: x0 + dx });
        await sleep(60);
        return { wStart, wMid, diag };
      };
      const r1 = await drag(60);
      const w1 = widthsOf();
      const d1 = window.__dwDragDebug;
      window.__dwDragDebug = null;
      window.__dwDragStart = null;
      const r2 = await drag(-40);
      const w2 = widthsOf();
      const d2 = window.__dwDragDebug;
      // LIVE responsiveness: the column must visibly widen DURING the +60 drag (before mouseup),
      // not only after release. Under auto layout a <col> width is advisory and wMid≈wStart — the
      // e2-col-dragging fixed-layout switch is what makes this true.
      const liveDelta = Math.round(r1.wMid - r1.wStart);
      result.checks = { w1, w2, d1, d2, liveDelta, r1, r2, start2: window.__dwDragStart };
      result.ok = !!w1 && !!w2 && w1 !== w2 && liveDelta > 20;
    } else if (mode === 'toolbarcell') {
      // The MAIN TOOLBAR must act on the OPEN CELL EDITOR, not the page:
      // B bolds the cell text, the Ω palette inserts into the cell (and must
      // never replace the selected table), the undo button undoes in-cell.
      const tbBtn = (t) => Array.from(document.querySelectorAll('.e2-maintoolbar button'))
        .find((b) => (b.getAttribute('data-tip') || '').startsWith(t));
      const tableCount = () => {
        let n = 0;
        view.state.doc.content.forEach((node) => { if (node.type.name === 'table') n++; });
        return n;
      };
      const tablesBefore = tableCount();
      selectTable(view);
      await sleep(50);
      const fig = document.querySelector('#editor2 .dw-table-figure.e2-active');
      mouse(fig.querySelectorAll('tbody tr')[0].children[0], 'mousedown');
      await sleep(60);
      const cell = window.__dwActiveCell;
      if (!cell || !cell.view) throw new Error('cell editor did not open');
      const mini = cell.view;
      // Select the whole cell text, click toolbar B.
      mini.dispatch(mini.state.tr.setSelection(
        TextSelection.create(mini.state.doc, 1, mini.state.doc.content.size - 1)));
      const bold = tbBtn('Bold');
      if (!bold) throw new Error('Bold button not found');
      bold.click();
      await sleep(30);
      let boldInCell = false;
      mini.state.doc.descendants((n) => {
        if (n.isText && n.marks.some((m) => m.type.name === 'strong')) boldInCell = true;
      });
      // Cursor to end of cell, open Ω, click the first symbol.
      mini.dispatch(mini.state.tr.setSelection(
        TextSelection.create(mini.state.doc, mini.state.doc.content.size - 1)));
      const insertBtn = tbBtn('Insert something');
      if (!insertBtn) throw new Error('Insert menu button not found');
      insertBtn.click();
      const omega = Array.from(document.querySelectorAll('.e2-menu .mi'))
        .find((m) => /Special character/.test(m.textContent));
      if (!omega) throw new Error('Special character not in the Insert menu');
      omega.click();
      await sleep(30);
      const sym = document.querySelector('.e2-contextbar .e2-tb-tools .ib');
      if (!sym) throw new Error('symbol palette did not open');
      const symbol = sym.textContent;
      sym.click();
      await sleep(30);
      const symbolInCell = mini.docView && mini.state.doc.textContent.includes(symbol);
      const tableSurvived = tableCount() === tablesBefore;
      // Toolbar undo must undo the in-cell symbol insert.
      const undoBtn = tbBtn('Undo');
      undoBtn.click();
      await sleep(30);
      const undoInCell = !mini.state.doc.textContent.includes(symbol);
      result.checks = { boldInCell, symbolInCell, tableSurvived, undoInCell, tablesBefore };
      result.ok = boldInCell && symbolInCell && tableSurvived && undoInCell;
    } else if (mode === 'cellimgtools') {
      // A cell-image tool (align/size/Replace) must apply AND raise no JS error.
      // The page has no app.js error handler, so listen for the uncaught error
      // a listener throw surfaces as (dispatchEvent reports, does not rethrow).
      let jsError = null;
      window.addEventListener('error', (e) => { jsError = e.message || String(e.error); });
      const tablePos = [];
      let scan = 0;
      view.state.doc.content.forEach((node) => { if (node.type.name === 'table') tablePos.push(scan); scan += node.nodeSize; });
      let cellEl = null;
      for (const tpos of tablePos) {
        view.dispatch(view.state.tr.setSelection(NodeSelection.create(view.state.doc, tpos)));
        await sleep(40);
        const fig = document.querySelector('#editor2 .dw-table-figure.e2-active');
        if (!fig) continue;
        cellEl = Array.from(fig.querySelectorAll('td, th')).find((c) => c.querySelector('img'));
        if (cellEl) break;
      }
      if (!cellEl) throw new Error('no image cell in any table of this chapter');
      mouse(cellEl.querySelector('img'), 'mousedown'); // cold click opens the cell editor
      await sleep(80);
      const liveImg = cellEl.querySelector('img');
      if (!liveImg) throw new Error('image gone after the cell editor opened');
      mouse(liveImg, 'click');                          // shows the cell-image tools
      await sleep(40);
      const alignBtn = Array.from(document.querySelectorAll('.e2-contextbar button'))
        .find((b) => b.getAttribute('data-tip') === 'Align right');
      if (!alignBtn) throw new Error('cell-image Align right tool not shown');
      alignBtn.click();
      await sleep(40);
      let aligned = false;
      const ce = window.__dwActiveCell;
      if (ce && ce.view) ce.view.state.doc.descendants((n) => { if (n.type.name === 'image' && n.attrs.align === 'right') aligned = true; });
      result.checks = { aligned, jsError };
      result.ok = aligned && !jsError;
      if (!result.ok) result.detail = jsError || 'align not applied';
    } else if (mode === 'escexit') {
      // Esc must deselect a selected table/figure even when DOM focus has drifted
      // off the editor view (e.g. after a caption blur or a closed dialog).
      let nodePos = -1, scan = 0;
      view.state.doc.content.forEach((node) => {
        if (nodePos < 0 && (node.type.name === 'table' || node.type.name === 'figure')) nodePos = scan;
        scan += node.nodeSize;
      });
      if (nodePos < 0) throw new Error('no table/figure in chapter');
      view.dispatch(view.state.tr.setSelection(NodeSelection.create(view.state.doc, nodePos)));
      await sleep(30);
      const selectedBefore = view.state.selection instanceof NodeSelection;
      // Drift focus off the view, as a caption-field blur or a closed dialog does.
      view.dom.blur();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      await sleep(10);
      document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      await sleep(30);
      const stillSelected = view.state.selection instanceof NodeSelection;
      result.checks = { selectedBefore, stillSelected };
      result.ok = selectedBefore && !stillSelected;
      if (!result.ok) result.detail = stillSelected ? 'Esc did not deselect with focus off the view' : 'node never selected';
    } else if (mode === 'cellresize') {
      // Dragging a picture's corner handle in a cell resizes it FREELY (to the
      // dragged width, not a snap stop, when away from the canonical sizes) and
      // raises no JS error.
      let jsError = null;
      window.addEventListener('error', (e) => { jsError = e.message || String(e.error); });
      const tablePos = [];
      let scan = 0;
      view.state.doc.content.forEach((node) => { if (node.type.name === 'table') tablePos.push(scan); scan += node.nodeSize; });
      let cellEl = null;
      for (const tpos of tablePos) {
        view.dispatch(view.state.tr.setSelection(NodeSelection.create(view.state.doc, tpos)));
        await sleep(40);
        const fig = document.querySelector('#editor2 .dw-table-figure.e2-active');
        if (!fig) continue;
        cellEl = Array.from(fig.querySelectorAll('td, th')).find((c) => c.querySelector('img'));
        if (cellEl) break;
      }
      if (!cellEl) throw new Error('no image cell in any table of this chapter');
      mouse(cellEl.querySelector('img'), 'mousedown'); // opens the cell editor
      await sleep(80);
      const liveImg = cellEl.querySelector('img');
      if (!liveImg) throw new Error('image gone after the cell editor opened');
      mouse(liveImg, 'click');                          // activates the handle
      await sleep(40);
      const handle = cellEl.querySelector('.e2-fighandle');
      if (!handle) throw new Error('cell resize handle not shown');
      const startW = liveImg.getBoundingClientRect().width;
      let dx = 50;
      const presets = [160, 320, 640];
      while (presets.some((s) => Math.abs(Math.round(startW + dx) - s) <= 14)) dx += 20;
      const x0 = handle.getBoundingClientRect().left;
      mouse(handle, 'mousedown', { clientX: x0 });
      await sleep(20);
      mouse(document, 'mousemove', { clientX: x0 + dx });
      await sleep(20);
      mouse(document, 'mouseup', { clientX: x0 + dx });
      await sleep(40);
      const expected = String(Math.max(80, Math.round(startW + dx)));
      let widthAttr = null;
      const ce = window.__dwActiveCell;
      if (ce && ce.view) ce.view.state.doc.descendants((n) => { if (n.type.name === 'image') widthAttr = n.attrs.width; });
      result.checks = { startW: Math.round(startW), dx, expected, widthAttr, jsError };

          view.state.doc.content.forEach((n) => { docNodesBefore.push(n); });
          const figIdxBefore = docNodesBefore.findIndex((n) => n.type.name === 'figure');
          paraUpBtn.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
          await sleep(60);
          const docNodesAfter = [];
          view.state.doc.content.forEach((n) => { docNodesAfter.push(n); });
          // The node at figIdxBefore should now be a paragraph (inserted above).
          paraAboveFig = figIdxBefore >= 0 && docNodesAfter[figIdxBefore] &&
                         docNodesAfter[figIdxBefore].type.name === 'paragraph';
        } else {
          paraAboveFig = true; // skip if no figure in chapter
        }
      } else {
        paraAboveFig = true; // skip if no figure in chapter
      }

      result.checks = { paraAfterContainer, paraAboveFig };
      result.ok = paraAfterContainer && paraAboveFig;
      if (!result.ok) result.detail = JSON.stringify(result.checks);

    } else if (mode === 'calloutexit') {
      // Gate (Task 11): cursor in an empty trailing paragraph inside a callout;
      // dispatch Enter; assert a new empty paragraph now exists AFTER the container.
      // Regression: normal Enter on a non-empty line still splits the paragraph.
      const contPos = firstNodePos(view, 'container');
      if (contPos < 0) throw new Error('no container in chapter');
      const contNode = view.state.doc.nodeAt(contPos);
      if (!contNode) throw new Error('no container node');
      // Insert an empty paragraph at the END of the container (simulate trailing empty line).
      // We need to place the cursor inside the container's last child (the trailing empty para).
      // First: add an empty para as the last child of the container.
      const insertInsidePt = contPos + contNode.nodeSize - 1; // just before container's closing
      const emptyPara = view.state.schema.nodes.paragraph.create();
      view.dispatch(view.state.tr.insert(insertInsidePt, emptyPara));
      await sleep(40);

      // Now position cursor inside that newly added empty trailing paragraph.
      const freshContNode = view.state.doc.nodeAt(contPos);
      if (!freshContNode) throw new Error('container gone after insert');
      // The empty para is the last child — get its position.
      let lastChildPos = contPos + 1;
      freshContNode.content.forEach((child, offset) => { lastChildPos = contPos + 1 + offset; });
      // lastChildPos is start of the last child; cursor goes inside it.
      const cursorPos = lastChildPos + 1;
      if (cursorPos > view.state.doc.content.size) throw new Error('cursor pos out of range');
      const resolvedPos = view.state.doc.resolve(Math.min(cursorPos, view.state.doc.content.size - 1));
      view.dispatch(view.state.tr.setSelection(TextSelection.near(resolvedPos)));
      await sleep(40);

      // Snapshot doc nodes before Enter.
      const docBefore = [];
      view.state.doc.content.forEach((n) => { docBefore.push(n.type.name); });

      // Simulate Enter key by dispatching the exitContainerOnEnter command.
      // (We can't dispatch a real keyboard event in headless; drive PM directly.)
      const { state } = view;
      let exitWorked = false;
      view.dispatch = (tr) => { view.updateState(view.state.apply(tr)); exitWorked = true; };
      const dispatchFn = (tr) => { view.updateState(view.state.apply(tr)); exitWorked = true; };
      // Access the exported keymap handler — use the Enter key binding directly via the keymap plugin.
      // Simulate via KeyboardEvent dispatch on the editor DOM.
      view.dom.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', bubbles: true, cancelable: true }));
      await sleep(60);

      // Restore normal dispatch.
      view.dispatch = (tr) => { view.updateState(view.state.apply(tr)); };

      // Check: doc after should have a paragraph AFTER the container.
      const docAfter = [];
      view.state.doc.content.forEach((n) => { docAfter.push(n.type.name); });
      const containerIdx = docAfter.indexOf('container');
      const paraAfterCallout = containerIdx >= 0 && docAfter[containerIdx + 1] === 'paragraph';

      // Regression: normal Enter inside a non-empty paragraph INSIDE a callout splits it.
      // Place cursor at end of first non-empty para inside the container.
      const freshCont2 = view.state.doc.nodeAt(contPos);
      let nonEmptyParaPos = -1;
      if (freshCont2) {
        let scan = contPos + 1;
        freshCont2.content.forEach((child) => {
          if (nonEmptyParaPos < 0 && child.type.name === 'paragraph' && child.content.size > 0)
            nonEmptyParaPos = scan + child.content.size; // cursor at end of text
          scan += child.nodeSize;
        });
      }
      let regressionOk = true;
      if (nonEmptyParaPos >= 0 && nonEmptyParaPos < view.state.doc.content.size) {
        const beforeSplit = [];
        view.state.doc.nodeAt(contPos) && view.state.doc.nodeAt(contPos).content.forEach((c) => beforeSplit.push(c.type.name));
        const r2 = view.state.doc.resolve(nonEmptyParaPos);
        view.dispatch(view.state.tr.setSelection(TextSelection.near(r2)));
        await sleep(40);
        view.dom.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', bubbles: true, cancelable: true }));
        await sleep(60);
        const freshCont3 = view.state.doc.nodeAt(contPos);
        if (freshCont3) {
          const afterSplit = [];
          freshCont3.content.forEach((c) => afterSplit.push(c.type.name));
          // A split should have added a paragraph (one more child than before).
          regressionOk = afterSplit.length > beforeSplit.length;
        }
      }

      result.checks = { paraAfterCallout, regressionOk, docBefore, docAfter };
      result.ok = paraAfterCallout && regressionOk;
      if (!result.ok) result.detail = JSON.stringify({ paraAfterCallout, regressionOk, docBefore: docBefore.join(','), docAfter: docAfter.join(',') });

    } else if (mode === 'calloutimg') {
      // Gate (Task 12): insert an image with cursor inside a callout; assert the
      // resulting node is a `figure` inside the container (not at doc level), that
      // FigureView tools (size/align/caption) are present, and showCaption===false.
      const contPos = firstNodePos(view, 'container');
      if (contPos < 0) throw new Error('no container in chapter');
      const contNode = view.state.doc.nodeAt(contPos);
      if (!contNode) throw new Error('container gone');
      // Place cursor inside the container's first paragraph.
      const firstChildPos = contPos + 1; // position of first child of container
      const cursorInside = firstChildPos + 1; // inside the paragraph
      const r = view.state.doc.resolve(Math.min(cursorInside, view.state.doc.content.size - 1));
      view.dispatch(view.state.tr.setSelection(TextSelection.near(r)));
      await sleep(40);

      // Call insert({ type: 'image', ... }) as if the dialog returned.
      window.DocWizEditor2.insert({
        type: 'image',
        src: '/assets/gate-callout-img.png',
        alt: 'gate-callout-img',
        width: null,
        align: null,
      });
      await sleep(80);

      // Assert: the container now has a figure child.
      const updatedCont = view.state.doc.nodeAt(contPos);
      let figureInContainer = false;
      let figureShowCaption = null;
      if (updatedCont) {
        updatedCont.content.forEach((child) => {
          if (child.type.name === 'figure') {
            figureInContainer = true;
            figureShowCaption = child.attrs.meta ? child.attrs.meta.showCaption : undefined;
          }
        });
      }

      // Assert: the figure is NOT at top-level doc (would be the case in the old bug).
      let figureAtDocLevel = false;
      view.state.doc.content.forEach((n) => {
        if (n.type.name === 'figure') figureAtDocLevel = true;
      });

      // Assert: FigureView renders its tools (size buttons present in the context bar).
      // Select the figure to trigger selectNode() → buildTools().
      let figPosInCont = -1;
      if (updatedCont) {
        let scan = contPos + 1;
        updatedCont.content.forEach((child) => {
          if (child.type.name === 'figure') figPosInCont = scan;
          scan += child.nodeSize;
        });
      }
      let toolsVisible = false;
      if (figPosInCont >= 0) {
        view.dispatch(view.state.tr.setSelection(NodeSelection.create(view.state.doc, figPosInCont)));
        await sleep(80);
        // FigureView.buildTools() mounts in .e2-contextbar; look for size buttons.
        toolsVisible = !!(document.querySelector('.e2-contextbar .e2-tb-tools') ||
                          document.querySelector('.e2-contextbar .e2-sizeset'));
      }

      const defaultCaptionOff = figureShowCaption === false;

      result.checks = { figureInContainer, figureAtDocLevel, defaultCaptionOff, toolsVisible, figureShowCaption };
      result.ok = figureInContainer && !figureAtDocLevel && defaultCaptionOff && toolsVisible;
      if (!result.ok) result.detail = JSON.stringify(result.checks);

    } else if (mode === 'tablefocus') {
      // Gate (Task 13): the Focus button must expand the table to fill the viewport.
      // Assert via getComputedStyle (headless rects are 0 for off-screen elements):
      // position:fixed + inset near 0 (small padding) = fullscreen. Then Esc exits.
      selectTable(view);
      await sleep(50);
      const fig = document.querySelector('#editor2 .dw-table-figure.e2-active');
      if (!fig) throw new Error('table did not activate on selection');
      // Invoke Focus through the real table bar: its ⋯ menu ("Focus this table").
      const moreBtn = Array.from(document.querySelectorAll('.e2-contextbar button'))
        .find((b) => (b.getAttribute('data-tip') || '').startsWith('More table tools'));
      if (!moreBtn) throw new Error('⋯ button not found in the table bar');
      moreBtn.click();
      const focusBtn = Array.from(document.querySelectorAll('.e2-menu .mi'))
        .find((m) => /Focus this table/.test(m.textContent));
      if (!focusBtn) throw new Error('Focus this table not in the ⋯ menu');
      focusBtn.click();
      await sleep(40);
      // Assert .e2-focus class is present.
      const hasFocusClass = fig.classList.contains('e2-focus');
      // Assert computed style: position fixed and inset small (covers viewport).
      const cs = getComputedStyle(fig);
      const positionValue = cs.position;
      const isFixed = positionValue === 'fixed';
      // The backdrop must be present (injected by setFocusMode(true)).
      const backdropPresent = !!document.getElementById('e2-focus-backdrop');
      // inset: var(--dw-s5) means top/right/bottom/left are all the spacing token, not 0 but near-0.
      // Check that top and left are not the old large offset values (296px tree, 150px header).
      const topPx = parseFloat(cs.top);
      const leftPx = parseFloat(cs.left);
      const notOldOffset = topPx < 100 && leftPx < 100; // inset token should be <48px
      // Exit focus via Esc.
      document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      await sleep(40);
      const exitedFocusClass = !fig.classList.contains('e2-focus');
      const backdropGone = !document.getElementById('e2-focus-backdrop');
      result.checks = { hasFocusClass, isFixed, positionValue, backdropPresent, topPx, leftPx, notOldOffset, exitedFocusClass, backdropGone };
      result.ok = hasFocusClass && isFixed && backdropPresent && notOldOffset && exitedFocusClass && backdropGone;
      if (!result.ok) result.detail = JSON.stringify(result.checks);

    } else if (mode === 'tasklist') {
      // Phase 3: a paragraph -> task list via the REAL toolbar button round-trips to "- [ ] ";
      // clicking the rendered checkbox round-trips to "- [x] "; exactly one of task/bullet is
      // active on a task list; the live doc carries a checked list_item + a rendered checkbox.
      const btn = (t) => Array.from(document.querySelectorAll('.e2-maintoolbar button'))
        .find((b) => (b.getAttribute('data-tip') || '').startsWith(t));
      const taskBtn = btn('Checklist');
      const bulletBtn = btn('Bulleted list');
      if (!taskBtn || !bulletBtn) throw new Error('task/bullet buttons not found');
      let pPos = -1;
      view.state.doc.descendants((n, pos) => {
        if (pPos < 0 && n.type.name === 'paragraph' && n.textContent.length > 3) { pPos = pos; return false; }
        return pPos < 0;
      });
      if (pPos < 0) throw new Error('no paragraph to convert');
      view.dispatch(view.state.tr.setSelection(TextSelection.create(view.state.doc, pPos + 1)));
      view.focus();
      taskBtn.click();
      await sleep(50);
      const hasOpen = window.DocWizEditor2.buildSaveText().includes('- [ ] ');
      const box = document.querySelector('#editor2 li.task-list-item > input[type=checkbox]');
      const boxFound = !!box;
      let hasDone = false;
      let renderedChecked = false;
      if (box) {
        // REAL click path: mousedown -> mouseup -> click (a bare .click() missed a bug where
        // preventDefault'ing the click reverted the checkbox's visual tick). We assert the
        // RENDERED checkbox below, not just the serialized state.
        const r = box.getBoundingClientRect();
        const o = { bubbles: true, cancelable: true, button: 0, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 };
        box.dispatchEvent(new MouseEvent('mousedown', o));
        box.dispatchEvent(new MouseEvent('mouseup', o));
        box.dispatchEvent(new MouseEvent('click', o));
        await sleep(50);
        hasDone = window.DocWizEditor2.buildSaveText().includes('- [x] ');
        const fresh = document.querySelector('#editor2 li.task-list-item > input[type=checkbox]');
        renderedChecked = !!(fresh && fresh.checked); // the VISIBLE tick must reflect the model
      }
      let liPos = -1;
      view.state.doc.descendants((n, pos) => { if (liPos < 0 && n.type.name === 'list_item') { liPos = pos; return false; } return liPos < 0; });
      if (liPos >= 0) view.dispatch(view.state.tr.setSelection(TextSelection.create(view.state.doc, liPos + 2)));
      await sleep(40);
      const taskActive = taskBtn.classList.contains('active');
      const bulletActive = bulletBtn.classList.contains('active');
      let checkedItem = false;
      view.state.doc.descendants((n) => { if (n.type.name === 'list_item' && n.attrs.checked === true) checkedItem = true; });
      const renderedBox = !!document.querySelector('#editor2 li.task-list-item > input[type=checkbox]');
      result.checks = { hasOpen, boxFound, hasDone, renderedChecked, taskActive, bulletActive, checkedItem, renderedBox };
      result.ok = hasOpen && boxFound && hasDone && renderedChecked && taskActive && !bulletActive && checkedItem && renderedBox;
      if (!result.ok) result.detail = JSON.stringify(result.checks) + ' saved=' + window.DocWizEditor2.buildSaveText().slice(0, 160);

    } else if (mode === 'listindent') {
      // Phase 3: indent nests a list item (round-trips to a 2-space-indented "- "), outdent
      // un-nests it, and on a plain paragraph the indent button is inapplicable (doc unchanged).
      const btn = (t) => Array.from(document.querySelectorAll('.e2-maintoolbar button'))
        .find((b) => (b.getAttribute('data-tip') || '').startsWith(t));
      const indentBtn = btn('Indent');
      const outdentBtn = btn('Outdent');
      if (!indentBtn || !outdentBtn) throw new Error('indent/outdent buttons not found');
      const sc = view.state.schema;
      const li = (t) => sc.nodes.list_item.create(null, sc.nodes.paragraph.create(null, sc.text(t)));
      const list = sc.nodes.bullet_list.create(null, [li('First item'), li('Second item')]);
      view.dispatch(view.state.tr.replaceWith(0, view.state.doc.content.size, list));
      await sleep(30);
      const items = [];
      view.state.doc.descendants((n, pos) => { if (n.type.name === 'list_item') items.push(pos); });
      view.dispatch(view.state.tr.setSelection(TextSelection.create(view.state.doc, items[1] + 2)));
      view.focus();
      await sleep(20);
      indentBtn.click();
      await sleep(40);
      const afterIndent = window.DocWizEditor2.buildSaveText();
      const nested = afterIndent.includes('  - Second item');
      outdentBtn.click();
      await sleep(40);
      const afterOutdent = window.DocWizEditor2.buildSaveText();
      const flat = afterOutdent.includes('- Second item') && !afterOutdent.includes('  - Second item');
      const para = sc.nodes.paragraph.create(null, sc.text('Plain paragraph here'));
      view.dispatch(view.state.tr.replaceWith(0, view.state.doc.content.size, para));
      view.dispatch(view.state.tr.setSelection(TextSelection.create(view.state.doc, 1)));
      view.focus();
      await sleep(20);
      const beforeNoop = window.DocWizEditor2.buildSaveText();
      indentBtn.click();
      await sleep(30);
      const unchanged = window.DocWizEditor2.buildSaveText() === beforeNoop;
      result.checks = { nested, flat, unchanged, afterIndent: afterIndent.slice(0, 120) };
      result.ok = nested && flat && unchanged;
      if (!result.ok) result.detail = JSON.stringify(result.checks);

    } else if (mode === 'probe') {
      // Layout probe: computed geometry of the first table figure (breakout debug).
      await sleep(100);
      const fig = document.querySelector('#editor2 .dw-table-figure');
      const table = fig && fig.querySelector('table');
      const art = document.querySelector('#editor2 article');
      const cs = fig && getComputedStyle(fig);
      result.checks = fig && {
        figRect: fig.getBoundingClientRect().toJSON(),
        tableRect: table && table.getBoundingClientRect().toJSON(),
        artRect: art.getBoundingClientRect().toJSON(),
        scrollLeft: fig.scrollLeft,
        width: cs.width, maxWidth: cs.maxWidth, minWidth: cs.minWidth,
        marginLeft: cs.marginLeft, transform: cs.transform, overflowX: cs.overflowX,
        firstCell: table && table.querySelector('tbody td') ? table.querySelector('tbody td').textContent : null,
      };
      result.ok = !!fig;
    } else {
      // Append text at the end of the first top-level paragraph.
      let pos = -1;
      let scan = 0;
      view.state.doc.content.forEach((node) => {
        if (pos < 0 && node.type.name === 'paragraph') pos = scan + node.nodeSize - 1;
        scan += node.nodeSize;
      });
      if (pos < 0) throw new Error('no paragraph in chapter');
      view.dispatch(view.state.tr.insertText(text, pos));
    }

    if (!['clickcells', 'cellopen', 'aligncycle', 'autofmt', 'undo', 'dragwidth2', 'toolbarcell', 'cellimgtools', 'cellresize', 'escexit', 'probe', 'insertall', 'typecell', 'cellsaveflush', 'sourceflush', 'celltab', 'cellbreak', 'cellwrap', 'tablecaption', 'tablecaptionquote', 'figcaptiontoggle', 'cellimgalt', 'figxs', 'figpx', 'figalignleft', 'seltools', 'addpara', 'calloutexit', 'calloutimg', 'tablefocus', 'cellwsclean', 'cellpasteinline', 'tasklist', 'listindent'].includes(mode)) {
      const dto = await window.DocWizEditor2.save({
        title: ch.title, discipline: ch.discipline, audiences: ch.audiences,
      });
      result.ok = true;
      result.newHash = dto.bodyHash;
    }
  } catch (e) {
    result.error = String((e && e.message) || e);
  }
  const pre = document.createElement('pre');
  pre.id = 'out';
  pre.textContent = JSON.stringify(result);
  document.body.appendChild(pre);
  document.title = 'DONE';
</script>
</body>
</html>
