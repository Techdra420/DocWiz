    title: What you will learn
    regions:
      body: |
        - **The idea** — one source, many outputs
        - **The editor** — the parts of the window
        - **Writing** — pictures, tables and building blocks
        - **Readers** — one manual for several audiences
        - **The handover** — check it, build it, send it

