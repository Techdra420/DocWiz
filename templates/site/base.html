<head>

<script>
  // Prefix to reach the _site/ root from this page ("" on a site page, "_site/" on the
  // root entry page). search.js prepends it to index URLs so search works from both.
  window.__dwBase = "{{BASE}}";
  (function () {
    var t = localStorage.getItem('dw-theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="{{BASE}}_dw/tokens.css">
<link rel="stylesheet" href="{{BASE}}_dw/site.css">
</head>
<body>

<header data-theme="dark">
  <span class="brand">{{PROJECT}}<small>{{CODE}} · v{{VERSION}}</small></span>
  <nav class="tabs">
{{TABS}}
  </nav>
  <button id="themeBtn" type="button">Dark</button>
</header>

<div class="shell">
  <aside id="sidebar">
    <div id="searchBox">
      <input id="searchInput" type="search" placeholder="Search documentation…" autocomplete="off" spellcheck="false">
      <div id="searchResults" hidden></div>
    </div>
{{NAV}}
  </aside>
  <main class="dw-zoomable">
    <article{{ARTICLE_ATTRS}}>
      <div class="crumb">{{CRUMB}}</div>
{{CONTENT}}
      <nav class="prevnext">
{{PREVNEXT}}
      </nav>
    </article>
  </main>
</div>

<footer>
  <span>{{PROJECT}} · {{CODE}}</span>
  <span>{{GENERATED}}</span>
</footer>

<script src="{{BASE}}_dw/search-index.js"></script>
<script src="{{BASE}}_dw/search.js"></script>
<script src="{{BASE}}_dw/site.js"></script>
<!-- Visual self-check probe (dev/verification only): inert unless the URL carries ?probe=1. -->
<script src="{{BASE}}_dw/probe.js" defer></script>
</body>
</html>
